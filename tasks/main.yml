---
- name: Install repository prerequisites
  become: yes
  apt:
    pkg: ca-certificates
    update_cache: yes
    cache_valid_time: 3600

- name: Ensure apt keyrings directory exists
  become: yes
  file: path=/etc/apt/keyrings state=directory mode=0755

- name: Add Redis repository key
  become: yes
  get_url:
    url: https://packages.redis.io/gpg
    dest: /etc/apt/keyrings/redis.asc
    mode: '0644'
    force: no

# distro packages are EOL upstream on jammy (6.0), noble and bookworm (7.0)
- name: Add Redis repository
  become: yes
  deb822_repository:
    name: redis
    uris: https://packages.redis.io/deb
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: /etc/apt/keyrings/redis.asc
    install_python_debian: yes
  register: redis_repo

- name: Update packages database for the Redis repository
  become: yes
  apt: update_cache=yes
  when: redis_repo is changed

- name: Install Redis
  become: yes
  apt: name=redis-server state=present

- name: Create config file
  become: yes
  template: src=conf.tpl dest={{ redis.conf_path }}/{{ redis.port }}.conf
  notify: restart redis

- name: Ensure redis is started
  become: yes
  service: name=redis-server state=started enabled=yes
